<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企業一覧 - 就活バイタル</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="company-list.css">
<link rel="stylesheet" href="character.css">
</head>
<body>
<div class="mobile-app-container">

<header class="app-header">
<div class="global-char-container">
<img src="character.png" class="global-char-img" id="globalCharImg">
<div class="global-speech-bubble">
<span id="globalMessageText">今日もえらい！</span>
</div>
</div>

<div class="global-level-display" style="margin-right: 0;">
Lv. <span id="levelNumber">0</span>
</div>
</header>

<ul class="company-list" id="companyList"></ul>

<button class="fab-add-btn" onclick="localStorage.removeItem('targetCompanyId'); location.href='add-company.html'">＋</button>

<nav class="bottom-nav">
<button class="nav-item active">企業一覧</button>
<button class="nav-item" onclick="location.href='mental.html'">メンタル</button>
<button class="nav-item" onclick="location.href='memo.html'">メモ</button>
</nav>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const defaultData = [
        { id: 1, name: "株式会社A（IT・通信）", status: "エントリー済み", memo: "次回：4/25 14:00 オンライン説明会" },
        { id: 2, name: "B商事（専門商社）", status: "1次面接待ち", memo: "ES見返す" },
        { id: 3, name: "C製薬", status: "最終結果待ち", memo: "面接での手応えあり。結果は1週間後。" }
    ];

    let companies = JSON.parse(localStorage.getItem('myCompanies'));
    if (!companies || companies.length === 0) {
        companies = defaultData;
        localStorage.setItem('myCompanies', JSON.stringify(companies));
    }

    const listContainer = document.getElementById('companyList');
    listContainer.innerHTML = ''; 

    companies.forEach(company => {
        const li = document.createElement('li');
        li.className = 'list-item';
        li.onclick = () => {
            localStorage.setItem('targetCompanyId', company.id);
            location.href = 'company-detail.html';
        };

        li.innerHTML = `
        <div class="company-info">
            <div class="company-name-row">
                <h2>${company.name}</h2>
                <span class="status-badge unified-blue-green">${company.status}</span>
            </div>
            <p class="latest-memo">${company.memo}</p>
        </div>
        `;
        listContainer.appendChild(li);
    });
});
</script>
<script src="character.js"></script>
</body>
</html>
