<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メモ - 就活バイタル</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="memo.css">
</head>
<body>
<div class="mobile-app-container">

<header class="app-header">
<h1>メモ</h1>
<div class="spacer"></div>
</header>

<div class="memo-content">

<div class="section-header">
<h2 class="section-title">ToDoリスト</h2>
<button class="add-text-btn" id="addToDoBtn">＋ 追加</button>
</div>
<div class="todo-card" id="todoContainer">
<label class="todo-item">
<input type="checkbox" class="custom-cb">
<span class="todo-text">株式会社A ES提出</span>
</label>
<label class="todo-item">
<input type="checkbox" class="custom-cb">
<span class="todo-text">B商事 Webテスト受験</span>
</label>
</div>

<div class="section-header">
<h2 class="section-title">自己PR・ガクチカ</h2>
<button class="add-text-btn" id="addPrBtn">＋ 項目を追加</button>
</div>

<div id="prContainer">
<div class="pr-card">
<input type="text" class="pr-title-input" placeholder="タイトル（例：A社用のガクチカ）">
<textarea class="custom-textarea" placeholder="内容を記入"></textarea>
<button class="delete-btn" onclick="this.parentElement.remove()">削除</button>
</div>
</div>

<button class="save-btn">すべてのメモを保存する</button>
</div> 

<nav class="bottom-nav">
<button class="nav-item" onclick="location.href='company-list.html'">企業一覧</button>
<button class="nav-item" onclick="location.href='mental.html'">メンタル</button>
<button class="nav-item active" onclick="location.href='memo.html'">メモ</button>
</nav>
</div>

<script>
// ToDoの追加ボタンの処理
document.getElementById('addToDoBtn').addEventListener('click', function() {
const container = document.getElementById('todoContainer');
const newLabel = document.createElement('label');
newLabel.className = 'todo-item';
// 入力できるテキストボックスとして追加します
newLabel.innerHTML = '<input type="checkbox" class="custom-cb"> <input type="text" class="todo-text" placeholder="新しいタスクを入力" style="border:none; background:transparent; width:100%; outline:none; color:#4a3f35; font-family:inherit;">';
container.appendChild(newLabel);
});

// 自己PRの追加ボタンの処理
document.getElementById('addPrBtn').addEventListener('click', function() {
const container = document.getElementById('prContainer');
const newCard = document.createElement('div');
newCard.className = 'pr-card';
newCard.innerHTML = '<input type="text" class="pr-title-input" placeholder="新しいタイトル"><textarea class="custom-textarea" placeholder="内容を記入"></textarea><button class="delete-btn" onclick="this.parentElement.remove()">削除</button>';
container.appendChild(newCard);
});
</script>
</body>
</html>
