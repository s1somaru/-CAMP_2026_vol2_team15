<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企業詳細 - 就活おともアプリ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="company-detail.css">
</head>
<body>
<div class="mobile-app-container">

<header class="app-header">
<button class="back-btn" onclick="location.href='company-list.html'">←</button>
<div class="header-title-area">
<h1 id="detailName">企業名読み込み中...</h1>
<span class="status-badge unified-blue-green" id="detailBadge">ステータス</span>
</div>
<div class="spacer"></div>
</header>

<div class="detail-content">
<section class="detail-section">
<label>選考進捗状況</label>
<div class="progress-container">
<div class="progress-bar" id="dynamicProgressBar" style="width: 0%;"></div>
<div class="progress-labels">
<span>エントリー</span>
<span>面談</span>
<span>ES</span>
<span>一次</span>
<span>二次</span>
<span>三次</span>
<span>最終</span>
</div>
</div>
</section>

<div class="info-card">
<div class="info-item">
<label>一言メモ</label>
<p id="detailMemo">メモ読み込み中...</p>
</div>
<div class="info-grid">
<div class="info-item">
<label>エントリー日</label>
<p id="detailEntryDate">未入力</p>
</div>
<div class="info-item">
<label>ES締め切り</label>
<p id="detailEsDate">未入力</p>
</div>
</div>
</div>

<div class="info-card">
<div class="info-item">
<label>面接内容・聞かれたこと</label>
<p id="detailInterview" style="white-space: pre-wrap;">未入力</p>
</div>
<div class="info-item">
<label>エントリーしたサイト</label>
<p id="detailSite">未入力</p>
</div>
<div class="info-item">
<label>必要書類</label>
<p id="detailDocs">未入力</p>
</div>
</div>

<button class="edit-btn" onclick="location.href='add-company.html'">内容を編集する</button>
<button class="delete-btn-outline" onclick="confirmDelete()">この企業を削除する</button>
</div>

<nav class="bottom-nav">
<button class="nav-item active" onclick="location.href='company-list.html'">企業一覧</button>
<button class="nav-item" onclick="location.href='mental.html'">メンタル</button>
<button class="nav-item" onclick="location.href='memo.html'">メモ</button>
</nav>
</div>

<script>
let currentId = localStorage.getItem('targetCompanyId');

window.onload = function() {
    const companies = JSON.parse(localStorage.getItem('myCompanies')) || [];
    const target = companies.find(c => c.id == currentId);

    let savedStatus = 'エントリー済み';

    if (target) {
        document.getElementById('detailName').innerText = target.name || "未入力";
        document.getElementById('detailBadge').innerText = target.status || "エントリー済み";
        document.getElementById('detailMemo').innerText = target.memo || "未入力";
        document.getElementById('detailEntryDate').innerText = target.entryDate || "未入力";
        document.getElementById('detailEsDate').innerText = target.esDate || "未入力";
        document.getElementById('detailSite').innerText = target.site || "未入力";
        document.getElementById('detailDocs').innerText = target.docs || "未入力";
        document.getElementById('detailInterview').innerText = target.interview || "未入力";
        savedStatus = target.status || 'エントリー済み';
    }

    const progressBar = document.getElementById('dynamicProgressBar');
    let widthPercent = "10%";
    if(savedStatus.includes('カジュアル')) widthPercent = "25%";
    if(savedStatus.includes('ES')) widthPercent = "40%";
    if(savedStatus.includes('1次')) widthPercent = "55%";
    if(savedStatus.includes('2次')) widthPercent = "70%";
    if(savedStatus.includes('3次')) widthPercent = "85%";
    if(savedStatus.includes('最終')) widthPercent = "95%";
    // 【追加】内定の場合もバーをMAXにします
    if(savedStatus.includes('内定')) widthPercent = "100%";
    if(savedStatus.includes('不合格')) widthPercent = "100%";

    progressBar.style.width = widthPercent;
};

function confirmDelete() {
    const result = confirm("この企業のデータを完全に削除しますか？");
    if (result) {
        let companies = JSON.parse(localStorage.getItem('myCompanies')) || [];
        companies = companies.filter(c => c.id != currentId);
        localStorage.setItem('myCompanies', JSON.stringify(companies));
        localStorage.removeItem('targetCompanyId');
        alert("削除しました");
        location.href = 'company-list.html';
    }
}
</script>
</body>
</html>
