<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン画面 - 就活バイタル</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="mobile-app-container login-screen">
<div class="login-container">
<h2>ログイン</h2>
<div class="input-group">
<label>メールアドレス</label>
<input type="email" id="emailInput" placeholder="example@mail.com">
</div>
<div class="input-group">
<label>パスワード</label>
<input type="password" id="passwordInput" placeholder="パスワードを入力">
</div>
<button id="loginButton" class="btn">ログインする</button>
<p id="message" style="margin-top: 15px; font-size: 13px; font-weight: 700;"></p>
</div>
</div>
<script src="main.js"></script>
</body>
</html>
